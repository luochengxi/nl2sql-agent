# ---------------------------------------------------------------
# 角色 / 账号 / 数据隔离（v1.1：无买家侧，仅卖家组织树）
# 行级隔离：scope 决定往 SQL 里下推哪种过滤条件
# 列级权限：column_policy 决定哪些字段剔除、哪些字段脱敏
# ---------------------------------------------------------------

roles:
  super_admin:
    label: 超级管理员
    scope: all
    column_policy: full
    desc: 可见全部数据
  region_manager:
    label: 区域经理
    scope: region
    column_policy: standard
    desc: 可汇总所辖区域下所有城市 / 店铺
  city_manager:
    label: 城市经理
    scope: city
    column_policy: standard
    desc: 仅可见本城市下所有店铺
  store_admin:
    label: 店铺管理员
    scope: store
    column_policy: restricted
    desc: 仅可见本人对应卖家店铺

column_policies:
  full:
    deny: []
    mask: {}
  standard:
    deny:
      - cost_amount
      - supplier_cost
    mask:
      customer_phone: phone
      seller_phone: phone
  restricted:
    deny:
      - cost_amount
      - supplier_cost
      - commission
      - target_gmv
    mask:
      customer_phone: phone
      seller_phone: phone

# 脱敏表达式模板：{col} 会被替换为列名
mask_rules:
  phone: "substr({col}, 1, 3) || '****' || substr({col}, -4)"
  amount: "round({col} / 100.0, 0) * 100"

